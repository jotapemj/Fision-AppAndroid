plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
}

android {
    namespace 'com.jotapeveloper.fision'
    compileSdk 34

    defaultConfig {
        applicationId "com.jotapeveloper.fision"
        minSdk 26
        targetSdk 34
        versionCode 27
        versionName "3.6.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = "1.8"
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    buildFeatures {
        viewBinding true
        prefab true
    }
    // Per-app language list (Android 13+ settings) generated from values-*.
    androidResources {
        generateLocaleConfig true
    }

    lint {
        lintConfig = file("lint.xml")
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    implementation 'com.google.oboe:oboe:1.9.3'

    // App dependencies

    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.preference:preference:1.2.1'

    implementation 'androidx.media:media:1.6.0'

    //Database
    def room_version = "2.5.0"
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"

    //External
    implementation 'io.github.ShawnLin013:number-picker:2.4.13'

    // Cloud server: Retrofit + OkHttp + Gson
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Encrypted token + biometrics
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'androidx.biometric:biometric:1.2.0-alpha05'

    // EXIF orientation for picked images (avatar crop)
    implementation 'androidx.exifinterface:exifinterface:1.3.7'

    // Palette extraction for the nebula background
    implementation 'androidx.palette:palette:1.0.0'

    // 3D Audio scene: SceneView (on top of Filament). Loads GLB, orbital
    // camera + touch gestures + picking out of the box.
    implementation libs.sceneview

    // Filament pinned to the exact version SceneView 2.2.1 was compiled
    // against (1.52.0). Newer runtimes broke the Utils.init() ABI (virtual
    // -> static) and crashed on inflate. All three Filament artifacts share
    // one version so their bundled native .so cross-reference cleanly.
    implementation libs.filament
    implementation libs.gltfio
    implementation libs.filamentUtils
}